[profile.default]
src = "src"
out = "out"
libs = ["lib"]
via-ir = true
optimizer = true
optimizer_runs = 200
solc_version = "0.8.20"
test = "test"
ffi = true
fs_permissions = [{ access = "read-write", path = "./"}]

[profile.default.fuzz]
runs = 1000
max_test_rejects = 100

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"